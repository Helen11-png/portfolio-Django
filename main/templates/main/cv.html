<style>
    /* Панель выбора */
    .checkbox-panel {

    .cv-header h1 { margin: 0; color: #8BE9FD; }

    #cv p, #cv li { color: #f8f8f2; line-height: 1.5; }
    #cv ul { margin: 6px 0 0 20px; padding: 0; }

    .hidden { display: none !important; }

    /* Печать / PDF: светлая версия только резюме */
    @media print {
        .no-print, .sidebar, .menu-toggle, .language-switcher { display: none !important; }
        body { background: #fff !important; color: #000 !important; display: block !important; }
        .main-content { margin: 0 !important; padding: 0 !important; width: 100% !important; max-width: none !important; }
        #cv, #cv * { color: #000 !important; }
        #cv .section { background: none !important; border: none !important; box-shadow: none !important; padding: 0 0 10px !important; }
        #cv h1, #cv h2 { color: #000 !important; }
        #cv h2 { border-bottom: 1px solid #000; padding-bottom: 2px; font-size: 15px; text-transform: uppercase; }
        .cv-item { break-inside: avoid; }
        @page { margin: 15mm; }
    }
</style>

<script>
    // Чекбоксы показывают/скрывают блоки и запоминают выбор в браузере
    const STORE_KEY = 'cv_toggles';
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch (e) {}

    document.querySelectorAll('.toggle').forEach(cb => {
        const target = document.getElementById(cb.dataset.target);
        if (!target) return;

        if (cb.dataset.target in saved) cb.checked = saved[cb.dataset.target];
        target.classList.toggle('hidden', !cb.checked);

        cb.addEventListener('change', () => {
            target.classList.toggle('hidden', !cb.checked);
            saved[cb.dataset.target] = cb.checked;
            try { localStorage.setItem(STORE_KEY, JSON.stringify(saved)); } catch (e) {}
        });
    });
</script>
