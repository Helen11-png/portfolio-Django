<!DOCTYPE html>

    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">

</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="avatar">
            <img src="/static/main/img/for_design/cat4.jpg" alt="cat" class="avatar-img">
        </div>

        <div class="contact-info">
            <h3><i class="fas fa-user"></i> Contact</h3>
            <a href="mailto:alena.nik.07@mail.ru" class="contact-item">
                <i class="fas fa-envelope"></i> alena.nik.07@mail.ru
            </a>
            <a href="https://github.com/Helen11-png" target="_blank" class="contact-item">
                <i class="fab fa-github"></i> github.com/Helen11-png
            </a>
            <a href="https://ru.linkedin.com/in/%D0%B0%D0%BB%D0%B5%D0%BD%D0%B0-%D0%BD%D0%B8%D0%BA%D0%B8%D1%82%D0%B8%D0%BD%D1%81%D0%BA%D0%B0%D1%8F-917253399" target="_blank" class="contact-item">
                <i class="fab fa-linkedin"></i> LinkedIn
            </a>
            <a class="contact-item">
                <i class="fas fa-phone"></i> +7 (916) 724-81-69
            </a>
            <a href="https://leetcode.com/u/helen11_png/" target="_blank" class="contact-item leetcode-custom">
                <i class="fas fa-terminal"></i> Leetcode
            </a>
            <a href="https://t.me/+-IbciZPlrYRjYzli" class="contact-item">
                <i class="fas fa-envelope"></i> My blog/portfolio (TG)
            </a>
        </div>


        <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid #44475a;">
            <p style="font-size: 12px; color: #6272a4; text-align: center;">
                © 2025 HELEN<br>
                All rights reserved
            </p>
        </div>
    </aside>
    <main class="main-content">
        <div class="no-print checkbox-panel">
            <label><input type="checkbox" class="toggle" data-target="about" checked> About</label>
            <label><input type="checkbox" class="toggle" data-target="education" checked> Education</label>
            <label><input type="checkbox" class="toggle" data-target="certs" checked> Certificates</label>
            <label><input type="checkbox" class="toggle" data-target="projects" checked> Projects</label>
            <button onclick="window.print()">Скачать PDF</button>
        </div>

        <div class="section" id="about">...</div>
        <div class="section" id="education">...</div>
        <div class="section" id="certs">...</div>
        <div class="section" id="projects">...</div>
    </main>

    <style>
        .checkbox-panel {
            display: flex;
            flex-direction: column;   /* вертикально */
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 20px;
            color: #f8f8f2;
        }
        .checkbox-panel button {
            margin-top: 8px;
            padding: 8px 16px;
            cursor: pointer;
        }
        .hidden { display: none !important; }
        @media print {
            .no-print { display: none; }
            body { background: #fff; color: #000; }
        }
    </style>

<script>
document.querySelectorAll('.toggle').forEach(cb => {
    cb.addEventListener('change', () => {
        document.getElementById(cb.dataset.target)
            .classList.toggle('hidden', !cb.checked);
    });
});
</script>
</body>
</html>
